spring:
  application:
    name: bankflow

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankflow}
    username: ${SPRING_DATASOURCE_USERNAME:bankflow}
    password: ${SPRING_DATASOURCE_PASSWORD:bankflow123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET:minha-chave-super-secreta-para-jwt-bankflow-2024-nao-usar-em-producao}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

banking:
  transfer:
    daily-limit: 50000.00
    single-limit: 10000.00
  withdraw:
    daily-limit: 5000.00
    single-limit: 2000.00

logging:
  level:
    com.banking: DEBUG
    org.springframework.security: INFO
