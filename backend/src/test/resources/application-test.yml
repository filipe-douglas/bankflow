spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-junit-tests-only-not-for-production-use
  expiration: 3600000
  refresh-expiration: 86400000

banking:
  transfer:
    daily-limit: 50000.00
    single-limit: 10000.00
  withdraw:
    daily-limit: 5000.00
    single-limit: 2000.00
